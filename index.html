<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTPR Resume Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#E8ECF1; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#14223A; --muted:#566277; --line:#C9D1DC;
  --accent:#2346A6; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --marker:#FFE55C; --warn-bg:#FFF2D2; --warn:#7A4A00; --ok:#1B6E45; --danger:#A3261F;
  --focus:0 0 0 3px #FFE55C, 0 0 0 5px #14223A;
  --radius:10px;
  --ui:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --paper:"Times New Roman", Tinos, Times, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131923; --surface:#1C2330; --surface-2:#232B39; --ink:#E7EBF2; --muted:#9BA6B8; --line:#374152;
    --accent:#9DB6FF; --accent-ink:#0E1523; --accent-soft:#26324A;
    --warn-bg:#3A2E12; --warn:#F5D48A; --ok:#7FD4A6; --danger:#FF9A92;
    --focus:0 0 0 3px #FFE55C, 0 0 0 5px #131923;
  }
}
:root[data-theme="dark"]{
  --bg:#131923; --surface:#1C2330; --surface-2:#232B39; --ink:#E7EBF2; --muted:#9BA6B8; --line:#374152;
  --accent:#9DB6FF; --accent-ink:#0E1523; --accent-soft:#26324A;
  --warn-bg:#3A2E12; --warn:#F5D48A; --ok:#7FD4A6; --danger:#FF9A92;
  --focus:0 0 0 3px #FFE55C, 0 0 0 5px #131923;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}

/* Top bar */
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand strong{font-size:17px}
.brand span{font-size:13px;color:var(--muted)}
.top .spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:5px 10px;font-size:14px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn.sublink{font-size:14px;font-weight:400;color:var(--muted);margin-top:2px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Layout */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr) minmax(380px,560px);gap:0;min-height:calc(100vh - 62px)}
.rail{padding:24px 12px 24px 20px;position:sticky;top:62px;align-self:start;max-height:calc(100vh - 62px);overflow:auto}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rail button{width:100%;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--muted)}
.rail button:hover{background:var(--surface)}
.rail .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--muted)}
.rail .done .num{border-color:var(--ok);color:var(--ok)}
.rail [aria-current="step"]{background:var(--surface);color:var(--ink);font-weight:700}
.rail [aria-current="step"] .num{background:var(--marker);border-color:#14223A;color:#14223A}

.main{padding:28px 32px 80px;min-width:0}
.form{max-width:680px}
.step-kicker{font-size:14px;color:var(--muted);margin:0 0 4px}
h1.step-title{font-size:30px;line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}
.lede{margin:0 0 24px;color:var(--muted);max-width:62ch}

.guide-note{border-left:4px solid var(--marker);background:var(--surface);padding:12px 16px;border-radius:0 var(--radius) var(--radius) 0;margin:0 0 24px;font-size:15px}
.guide-note p{margin:0}
.guide-note p + p{margin-top:6px}
.guide-note b{font-weight:700}

.group{margin:0 0 28px}
.group > h2{font-size:19px;margin:0 0 4px}
.group > .sub{margin:0 0 14px;color:var(--muted);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 16px}
.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.label{font-weight:700;font-size:15px}
.field .opt{font-weight:400;color:var(--muted)}
.input,textarea.input,select.input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font-size:16px;line-height:1.4}
textarea.input{resize:vertical;min-height:64px}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--muted);opacity:.75}
.hint{font-size:14px;color:var(--muted);margin:0}
.msg:empty{display:none}
.msg{font-size:14px;color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:6px;margin:0}
.msg.info{color:var(--ink);background:var(--surface-2)}

.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px}
.entry-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.entry-head h3{font-size:16px;margin:0}
.add-row{display:flex;flex-wrap:wrap;gap:8px}

.bullets{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.bullet-row{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:start}
.bullet-row .dot{margin-top:14px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.bullet-row .dot.sub{background:transparent;border:1.5px solid var(--ink);margin-left:4px}
.bullet-row .x{margin-top:6px}
.bullet-row .msg{margin-top:6px}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:8px;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--danger)}

.choice{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice.three{grid-template-columns:repeat(3,1fr)}
.choice label{position:relative;display:block;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.choice label:has(input:focus-visible){box-shadow:var(--focus)}
.choice strong{display:block;font-size:17px}
.choice span{display:block;font-size:14px;color:var(--muted);margin-top:2px}

.cat{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat input[type=checkbox]{width:20px;height:20px;margin-top:10px;accent-color:var(--accent)}
.cat .cat-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.cat.off .cat-body{opacity:.55}
.cat .cat-top{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:end}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--accent)}

.example{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px;margin:0}
.example b{display:block;margin-bottom:2px}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--warn-bg);color:var(--warn);border-radius:var(--radius);padding:12px 14px;margin:0 0 18px;font-size:15px}
.banner p{margin:0;flex:1 1 260px}

.stepnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}

/* Review */
.checklist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.checklist li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px}
.checklist .ic{font-weight:700;text-align:center}
.checklist .good .ic{color:var(--ok)}
.checklist .fix .ic{color:var(--warn)}
.checklist li button{margin-left:4px}
.next-steps{margin:0;padding-left:22px}
.next-steps li{margin:0 0 8px}
.next-steps ul{margin:6px 0 0;padding-left:20px}

/* Preview */
.preview{position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--surface-2)}
.preview-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.preview-bar .title{font-weight:700}
.pages{font-size:14px;color:var(--muted)}
.pages.over{color:var(--warn)}
.preview-bar .spacer{flex:1}
.preview-scroll{flex:1;overflow:auto;padding:18px}
.sheet-wrap{margin:0 auto;position:relative}
.sheet{width:816px;background:#fff;color:#000;box-shadow:0 1px 2px rgba(20,34,58,.18),0 8px 24px rgba(20,34,58,.10);transform-origin:top left;position:absolute;top:0;left:0}
.sheet-inner{padding:19.2px 18px 14.4px 30px;font-family:Garamond,"EB Garamond",Georgia,serif;font-size:14px;line-height:16px;color:#000}
.pb{position:absolute;left:0;right:0;border-top:2px dashed #9aa6b8;pointer-events:none}
.pb span{position:absolute;left:6px;top:4px;font:700 12px var(--ui);color:#566277;background:#fff;padding:0 3px}
.r-sec{border-radius:2px}
.r-sec.hl{background:rgba(255,229,92,.55);box-shadow:0 0 0 6px rgba(255,229,92,.55)}
.r-name{text-align:center;font-weight:700;font-size:21.33px;line-height:26px;color:#404040}
.r-contact{text-align:center;margin-bottom:11.5px}
.r-link{color:#0000ee;text-decoration:underline}
.r-heading{font-weight:700;font-size:14.67px;line-height:17px;color:#404040;border-bottom:1px solid #000;padding-bottom:1.5px;margin:16px 0 7.5px}
.r-sec[data-sec="header"] + .r-sec > .r-heading:first-child{margin-top:0}
.r-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.r-row .l{min-width:0}
.r-row .r{flex:none;white-space:nowrap;text-align:right}
.r-en{font-weight:700}
.gray{color:#404040}
.r-sep{height:10.6px}
.r-detail{padding-left:48px}
.r-bullet{position:relative;padding-left:18.9px}
.r-bullet::before{content:"\2022";position:absolute;left:1px;top:0}
.r-bullet.l1{padding-left:42.9px}
.r-bullet.l1::before{content:"o";left:24px}
.r-table{display:grid;column-gap:8px}
.ph{color:#9aa3b0}

.show-preview-btn{display:none}
.verb-dialog{border:0;border-radius:14px;padding:0;max-width:760px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.verb-dialog::backdrop{background:rgba(10,15,25,.5)}
.vd-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.vd-head h2{margin:0;font-size:19px;flex:1}
.vd-body{padding:16px 20px 22px;max-height:65vh;overflow:auto}
.vd-body h3{font-size:15px;margin:14px 0 8px}
.vd-body h3:first-child{margin-top:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1280px){
  .shell{grid-template-columns:minmax(0,1fr) minmax(360px,480px)}
  .rail{grid-column:1/-1;position:static;max-height:none;padding:12px 20px 0;overflow-x:auto}
  .rail ol{flex-direction:row;gap:4px}
  .rail button{grid-template-columns:26px auto;white-space:nowrap;padding:6px 10px}
  .main{grid-column:1}
  .preview{grid-column:2;grid-row:2}
  .rail{grid-row:1}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .main{padding:20px 16px 110px}
  .rail{padding:10px 16px 0}
  .rail .lbl{display:none}
  .rail [aria-current="step"] .lbl{display:inline}
  .grid2,.grid3,.choice,.choice.three{grid-template-columns:1fr}
  .preview{display:none;position:fixed;inset:0;height:100%;z-index:40;border-left:0}
  body.show-preview .preview{display:flex}
  .show-preview-btn{display:inline-flex;position:fixed;right:16px;bottom:16px;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .top .hide-sm{display:none}
  .preview-bar{padding:10px 12px;gap:8px}
  .preview-bar .title{display:none}
  h1.step-title{font-size:25px}
}
@media (min-width:901px){ .close-preview{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

<body>
<header class="top">
  <div class="brand"><strong>TTPR Resume Workbook</strong><span>Based on the Cohort-2 Resume Guide (9/16/2026)</span></div>
  <div class="spacer"></div>
  <button type="button" class="btn ghost hide-sm" data-action="verbs">Action verbs</button>
  <button type="button" class="btn hide-sm" data-action="save-progress" data-dl>Save progress file</button>
  <button type="button" class="btn ghost hide-sm" data-action="load-progress">Load progress file</button>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Workbook steps"></nav>
  <main class="main"><div class="form" id="form"></div></main>
  <aside class="preview" aria-label="Resume preview">
    <div class="preview-bar">
      <span class="title">Your resume</span><span class="pages" id="pages" aria-live="polite">1 page</span>
      <span class="spacer"></span>
      <button type="button" class="btn small primary" data-action="download" data-dl>Download .docx</button>
      <button type="button" class="btn small close-preview" data-action="hide-preview">Close</button>
    </div>
    <div class="preview-scroll" id="preview-scroll">
      <div class="sheet-wrap" id="sheet-wrap"><div class="sheet" id="sheet"><div class="sheet-inner" id="sheet-inner"></div></div></div>
    </div>
  </aside>
</div>
<button type="button" class="btn primary show-preview-btn" data-action="show-preview">View resume</button>
<input type="file" id="load-file" accept=".json,application/json" hidden>
<dialog class="verb-dialog" id="verbs" aria-labelledby="verbs-title">
  <div class="vd-head"><h2 id="verbs-title">Action verbs from the guide</h2><button type="button" class="btn small" data-close>Close</button></div>
  <div class="vd-body"><p class="hint" style="margin:0 0 12px">Start every bullet with a strong action verb. Click into a bullet, then pick a verb to add it to the front.</p><div id="verb-body"></div></div>

function startsWithVerb(text) {
  const w = (text || "").trim().split(/\s+/)[0] || "";
  const word = w.replace(/[^A-Za-z-]/g, "").toLowerCase();
  if (!word) return true;
  if (["responsible","duties","duty","i","my","was","were","tasked","in","as","the","a","an"].includes(word)) return false;
  return VERB_SET.has(word) || /[a-z]ed$/.test(word);
}

/* Bring a saved workbook (v1 or v2) up to the current shape */
function migrateState(obj) {
  if (!obj || (obj.v !== 1 && obj.v !== 2)) return null;
  const d = defaultState();
  for (const k of Object.keys(d)) if (obj[k] !== undefined) {
    d[k] = (d[k] && typeof d[k] === "object" && !Array.isArray(d[k])) ? Object.assign(d[k], obj[k]) : obj[k];
  }
  if (obj.v === 1) {
    const t = d.ttpr;
    if (t.org === OLD_TTPR_ORG) { t.org = TTPR_ORG; t.about = TTPR_ABOUT; t.location = TTPR_LOC; }
    const flat = Array.isArray(t.subs) && t.subs.every(x => typeof x === "string") ? t.subs : [];
    const p = PRESETS[d.track];
    if (p && JSON.stringify(t.bullets) === JSON.stringify(p.oldBullets)) { t.bullets = p.bullets.slice(); t.subs = t.bullets.map(() => []); if (flat.length) t.subs[1] = flat.slice(); }
    else { t.subs = t.bullets.map(() => []); if (flat.length && t.bullets.length) t.subs[Math.min(1, t.bullets.length - 1)] = flat.slice(); }
    d.education.forEach((e, i) => { if (e.location === undefined) e.location = i === 0 ? "New York, NY" : ""; });
    const fixJob = j => { if (j.about === undefined) j.about = ""; };
    d.techJobs.forEach(fixJob); d.otherSections.forEach(s => s.jobs.forEach(fixJob));
    d.leadership.items.forEach(it => { if (it.location === undefined) it.location = ""; });
    d.v = 2;
  }
  // Capstone now uses a single MM/YYYY date
  const cap = d.capstone;
  if (cap.date === undefined || (obj.capstone && obj.capstone.date === undefined)) {
    const raw = clean((obj.capstone && (obj.capstone.end || obj.capstone.start)) || "08/2026");
    const m = raw.match(/^(\d{1,2})\/\d{1,2}\/(\d{4})$/);
    cap.date = m ? `${m[1].padStart(2, "0")}/${m[2]}` : raw;
  }
  delete cap.start; delete cap.end;
  // Degree name is now spelled out
  d.education.forEach(e => { if (clean(e.degree) === "BA Business Administration - Computer Information Systems") e.degree = "Bachelor of Business Administration - Computer Information Systems"; });
  delete d.skills.seeLinkedIn;
  delete cap.note;
  // 10/2026: new Data Analytics TTPR entry (title on the program line, six bullets)
  if (obj.ttpr && obj.ttpr.inline === undefined) {
    const t = d.ttpr;
    t.inline = false;
    if (d.track === "data") {
      const p = PRESETS.data;
      if (t.org === TTPR_ORG && t.about === TTPR_ABOUT && t.location === TTPR_LOC && t.dates === "06/2026 – Present") Object.assign(t, p.entry);
      if (JSON.stringify(t.bullets) === JSON.stringify(p.prevBullets)) {
        const kept = (t.subs || []).flat().map(clean).filter(Boolean);
        t.bullets = p.bullets.slice();
        t.subs = t.bullets.map(() => []);
        if (kept.length) t.subs[0] = kept;
      }
    }
  }
  // TTPR date uses MM/YYYY like the rest of the resume
  if (clean(d.ttpr.dates) === "Jun 2026 – Present") d.ttpr.dates = "06/2026 – Present";
  if (d.skills.layout === "line" && !clean(d.skills.line) && PRESETS[d.track]) d.skills.line = PRESETS[d.track].line;
  // 10/30/2026: both tracks use "Tech Talent Pipeline Residency Program Apprenticeship - <title>"
  { const t = d.ttpr, p = PRESETS[d.track];
    if (p && (p.interimEntries || []).some(e => clean(t.org) === e.org && clean(t.about) === e.about)) { t.org = p.entry.org; t.about = p.entry.about; t.upper = p.entry.upper; } }
  // 10/2026: new Cybersecurity TTPR entry (single program line, six bullets)
  if (d.track === "cyber") {
    const t = d.ttpr, p = PRESETS.cyber, pe = p.prevEntry;
    if (["title", "org", "about", "location", "dates"].every(k => clean(t[k]) === pe[k]) && !t.inline) { t.title = p.title; Object.assign(t, p.entry); }
    if (JSON.stringify(t.bullets) === JSON.stringify(p.prevBullets)) {
      const kept = (t.subs || []).flat().map(clean).filter(Boolean);
      t.bullets = p.bullets.slice();
      t.subs = t.bullets.map(() => []);
      if (kept.length) t.subs[0] = kept;
    }
  }
  // 11/2026: new five-bullet entries for both tracks, and the cyber title
  { const t = d.ttpr, p = PRESETS[d.track];
    if (p && JSON.stringify(t.bullets) === JSON.stringify(p.bullets1030)) {
      const kept = (t.subs || []).flat().map(clean).filter(Boolean);
      t.bullets = p.bullets.slice(); t.subs = t.bullets.map(() => []);
      if (kept.length) t.subs[0] = kept;
    }
    if (p && p.prevTitle && p.prevTitle !== p.title && clean(t.title) === p.prevTitle) t.title = p.title; }
  normalizeState(d);
  return d;
}
function normalizeState(s) {
  const t = s.ttpr;
  if (!Array.isArray(t.subs)) t.subs = [];
  t.subs = t.bullets.map((_, i) => Array.isArray(t.subs[i]) ? t.subs[i] : []);
  return s;
}

function trackPresetParts(track) {
  const p = PRESETS[track];
  return {
    concentration: p.concentration,
    ttpr: Object.assign({ heading: p.heading, title: p.title, bullets: p.bullets.slice() }, p.entry),
    short: p.short.map(([name, items]) => ({ on: true, name, items })),
    table: p.table.map(([name, items, col]) => ({ on: true, name, items: items.join("\n"), col }))
  };
}

/* ---------- Document model shared by preview and .docx ---------- */
const R = (text, o = {}) => ({ text, b: !!o.b, gray: !!o.gray });
const has = s => (s || "").toString().trim().length > 0;
const clean = s => (s || "").toString().trim();
function dateRange(a, b) { a = clean(a); b = clean(b); return a && b ? `${a} – ${b}` : (a || b); }
function gpaOk(g) { const n = parseFloat(clean(g)); return !isNaN(n) && n >= 3.5; }
function tableLines(txt) { return (txt || "").split("\n").map(clean).filter(Boolean); }

/*
  Block types (styled after the TTPR layout template):
  name, contact, heading, entry {name, about, right, gray, upper}, sub {text, right, gray},
  detail {runs}, bullet {runs, level}, line {runs}, table {cols}, sep
*/
function buildModel(s) {
  const B = [];
  const add = (sec, blk) => { blk.sec = sec; B.push(blk); };
  const h = s.header;

  add("header", { t: "name", text: has(h.name) ? clean(h.name).toUpperCase() : "FIRST LAST", ph: !has(h.name) });
  const items = [
    [h.location, "New York, NY", ""], [h.phone, "(XXX) XXX-XXXX", "P: "], [h.email, "email@gmail.com", "", true],
    [h.linkedin, "LinkedIn tiny URL", ""], [h.website, "", ""]
  ].map(([v, ph, pre, link]) => has(v) ? { text: pre + clean(v), link: link ? clean(v) : "", ph: false } : (ph ? { text: pre + ph, ph: true } : null)).filter(Boolean);
  add("header", { t: "contact", items });

  const section = (sec, heading, groups, showEmpty) => {
    const gs = groups.filter(g => g.length);
    if (!gs.length && !showEmpty) return;
    add(sec, { t: "heading", text: clean(heading).toUpperCase() });
    gs.forEach((g, i) => { if (i) add(sec, { t: "sep" }); g.forEach(b => add(sec, b)); });
  };
  const bullet = (runs, level = 0) => ({ t: "bullet", runs: Array.isArray(runs) ? runs : [R(runs)], level });
  const bulletsOf = arr => (arr || []).map(clean).filter(Boolean).map(t => bullet(t));
  const entryHead = (name, about, right, o = {}) => ({ t: "entry", name: clean(name), about: clean(about), right: clean(right), gray: o.gray !== false, upper: o.upper !== false, rightBold: !!o.rightBold });
  const job = j => {
    const g = [];
    if (has(j.org)) g.push(entryHead(j.org, j.about, j.location, { rightBold: true }));
    const dr = dateRange(j.start, j.end);
    if (has(j.title) || dr) g.push({ t: "sub", text: clean(j.title), right: dr, gray: false });
    return g.concat(bulletsOf(j.bullets));
  };

  // EDUCATION
  const edu = s.education.map(e => {
    const g = [];
    if (!has(e.school) && !has(e.degree)) return g;
    const grad = has(e.grad) ? `${e.gradLabel || "Expected Graduation"}- ${clean(e.grad)}` : "";
    if (has(e.school) || grad) g.push({ t: "eduhead", school: clean(e.school).toUpperCase(), location: clean(e.location), right: grad });
    const extras = [has(e.concentration) ? `Concentration in ${clean(e.concentration)}` : "", gpaOk(e.gpa) ? `GPA: ${clean(e.gpa)}` : ""].filter(Boolean);
    if (has(e.degree) || extras.length) {
      g.push({ t: "line", runs: [R(clean(e.degree) + (extras.length ? ":" : ""), { gray: 1 }), ...(extras.length ? [R(" " + extras.join("- "))] : [])] });
    }
    if (has(e.honors)) g.push({ t: "line", runs: [R(`Academic Honors: ${clean(e.honors)}`)] });
    if (has(e.coursework)) g.push({ t: "line", runs: [R(`Relevant Coursework: ${clean(e.coursework)}`)] });
    return g;
  });
  section("education", "EDUCATION", edu, true);

  // SKILLS & CERTIFICATIONS
  const sk = s.skills, sb = [];
  if (sk.layout === "line") {
    if (has(sk.line)) sb.push({ t: "line", runs: [R("Technical Skills: ", { b: 1 }), R(clean(sk.line))] });
    else sb.push({ t: "line", ph: true, runs: [R("Technical Skills: ", { b: 1 }), R("Type your skills, separated by commas")] });
  } else {

    if (sk.layout === "short") {
      cats.forEach(c => sb.push(bullet([R(clean(c.name) + (has(c.items) ? ": " : ""), { b: 1 }), R(clean(c.items))])));
    } else if (cats.length) {

      const cols = Array.from({ length: ncols }, () => []);

  if (has(sk.languages)) sb.push({ t: "line", runs: [R("Languages: ", { b: 1 }), R(clean(sk.languages))] });

    }
    (t.bullets || []).forEach((x, i) => {
      if (!has(x)) return;

  s.otherSections.forEach(os => section("other", has(os.heading) ? os.heading : "EXPERIENCE", os.jobs.map(job), false));

  const c = s.capstone, pg = [];
  if (has(c.name)) {
    pg.push([entryHead(c.name, "", c.date, { gray: false, rightBold: true }),
      ...bulletsOf([c.purpose, c.approach, c.outcomes, c.contribution, ...(c.extra || [])])]);
  }
  s.projects.forEach(p => { if (has(p.name)) pg.push([entryHead(p.name, "", p.dates, { gray: false, rightBold: true }), ...bulletsOf(p.bullets)]); });
  section("projects", "PROJECTS", pg, true);

  // LEADERSHIP & INVOLVEMENT
  const lg = s.leadership.items.filter(it => has(it.org)).map(it => {
    const g = [entryHead(it.org, "", it.location)];

function xmlEsc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function buildDocumentXml(model, root, sectPr) {
  const RF = '<w:rFonts w:ascii="Garamond" w:eastAsia="Garamond" w:hAnsi="Garamond" w:cs="Garamond"/>';
  const rPr = (o = {}) => `<w:rPr>${o.link ? '<w:rStyle w:val="Hyperlink"/>' : ""}${RF}${o.b ? "<w:b/><w:bCs/>" : ""}${o.color ? `<w:color w:val="${o.color}"/>` : ""}<w:sz w:val="${o.sz || 21}"/><w:szCs w:val="${o.sz || 21}"/></w:rPr>`;
  const run = (text, o = {}) => `<w:r>${rPr(o)}${o.tab ? "<w:tab/>" : ""}<w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r>`;
  const SP = '<w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/>';
  // pPr child order: numPr, pBdr, tabs, spacing, ind, jc
  const p = (pPr, runs, mark = {}) => {
    const withSp = /<w:ind |<w:jc /.test(pPr) ? pPr.replace(/(<w:ind |<w:jc )/, SP + "$1") : pPr + SP;
    return `<w:p><w:pPr>${withSp}${rPr(mark)}</w:pPr>${runs}</w:p>`;
  };
  const NOBDR = '<w:pBdr><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:between w:val="nil"/></w:pBdr>';
  const T900 = '<w:tabs><w:tab w:val="left" w:pos="900"/></w:tabs>';
  const TENTRY = '<w:tabs><w:tab w:val="right" w:pos="11520"/></w:tabs>';
  const TBUL = '<w:tabs><w:tab w:val="left" w:pos="284"/><w:tab w:val="left" w:pos="630"/><w:tab w:val="left" w:pos="900"/></w:tabs>';
  const empty = (sz, pPr = "") => p(pPr, "", { sz });
  const bulletP = (b, cell) => p(`<w:numPr><w:ilvl w:val="${b.level ? 1 : 0}"/><w:numId w:val="1"/></w:numPr>${NOBDR}${TBUL}<w:ind w:left="${b.level ? 644 : 284}" w:hanging="270"/>`,
    b.runs.map(r => run(r.text, { b: r.b })).join(""), { color: "000000" });
  const lineP = b => p(T900, b.runs.map(r => run(r.text, { b: r.b, color: r.gray ? "404040" : "" })).join(""));
  let out = "", rels = [], first = true;
  model.forEach(b => {
    switch (b.t) {
      case "name":
        if (b.ph) return;
        out += p('<w:jc w:val="center"/>', run(b.text, { b: 1, color: "404040", sz: 32 }), { color: "404040", sz: 36 }); break;
      case "contact": {
        const real = b.items.filter(x => !x.ph);
        if (!real.length) return;
        const parts = real.map((x, i) => {
          const sep = i ? run(" | ") : "";
          if (x.link) { const id = "rIdMail" + rels.length; rels.push(`<Relationship Id="${id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="mailto:${xmlEsc(x.link)}" TargetMode="External"/>`); return sep + `<w:hyperlink r:id="${id}" w:history="1">${run(x.text, { link: 1 })}</w:hyperlink>`; }
          return sep + run(x.text);
        }).join("");
        out += p('<w:jc w:val="center"/>', parts); break;
      }
      case "heading":
        out += first ? empty(15) : empty(21);
        first = false;
        out += p(`<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="000000"/></w:pBdr>${T900}`, run(b.text, { b: 1, color: "404040", sz: 22 }));
        out += empty(4, T900) + empty(6, T900); break;
      case "sep": out += empty(14, TENTRY); break;
      case "eduhead": {
        let runs = run(b.school, { b: 1, color: "404040" });
        if (b.location) runs += run("- ") + run(b.location, { b: 1 });
        if (b.right) runs += run(b.right, { tab: 1, b: 1 });
        out += p(TENTRY, runs, { sz: 22 }); break;
      }
      case "entry": {
        const nameTxt = b.upper ? b.name.toUpperCase() : b.name;
        let runs = run(nameTxt, { b: 1, color: b.gray ? "404040" : "" });
        if (b.about) runs += run((b.aboutPlain ? "" : " ") + b.about, { color: b.aboutPlain ? "" : "404040" });
        if (b.right) runs += run(b.right, { tab: 1, b: b.rightBold });
        out += p(TENTRY, runs, { sz: 22 }); break;
      }
      case "sub":
        out += p(TENTRY, (b.text ? run(b.text, { color: b.gray ? "404040" : "" }) : "") + (b.right ? run(b.right, { tab: 1 }) : "")); break;
      case "detail":
        out += p(`${NOBDR}<w:tabs><w:tab w:val="left" w:pos="284"/><w:tab w:val="left" w:pos="630"/></w:tabs><w:ind w:left="720"/>`, b.runs.map(r => run(r.text, { b: r.b, color: "000000" })).join(""), { color: "000000" }); break;
      case "bullet": out += bulletP(b); break;
      case "line": if (!b.ph) out += lineP(b); break;
      case "table": {
        const W = 11520, n = b.cols.length, cw = Math.floor(W / n);
        const none = '<w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/>';
        out += `<w:tbl><w:tblPr><w:tblW w:w="${cw * n}" w:type="dxa"/><w:tblBorders>${none}<w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="0" w:type="dxa"/><w:right w:w="115" w:type="dxa"/></w:tblCellMar><w:tblLook w:val="0000"/></w:tblPr><w:tblGrid>${Array(n).fill(`<w:gridCol w:w="${cw}"/>`).join("")}</w:tblGrid><w:tr>`
          + b.cols.map(col => `<w:tc><w:tcPr><w:tcW w:w="${cw}" w:type="dxa"/></w:tcPr>${col.length ? col.map(x => x.t === "bullet" ? bulletP(x) : lineP(x)).join("") : empty(21)}</w:tc>`).join("")
          + `</w:tr></w:tbl>`;
        break;
      }
    }
  });
  const body = `${root}<w:body>${out}${sectPr}</w:body></w:document>`;
  return { xml: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' + body, rels };
}
async function buildDocx(model, JSZipLib, baseB64, root, sectPr) {
  const zip = await JSZipLib.loadAsync(baseB64, { base64: true });
  const { xml, rels } = buildDocumentXml(model, root, sectPr);
  zip.file("word/document.xml", xml);
  let relXml = await zip.file("word/_rels/document.xml.rels").async("string");
  relXml = relXml.replace(/<Relationship Id="rId5"[^>]*\/>/, "").replace("</Relationships>", rels.join("") + "</Relationships>");
  zip.file("word/_rels/document.xml.rels", relXml);
  return zip.generateAsync({ type: typeof Blob !== "undefined" && typeof window !== "undefined" ? "blob" : "nodebuffer", compression: "DEFLATE", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

if (typeof module !== "undefined" && module.exports) module.exports = { PRESETS, VERBS, defaultState, migrateState, normalizeState, trackPresetParts, buildModel, buildDocx, startsWithVerb, blankJob };

<script>(function () {

  function reviewItems() {
    const s = state, out = [];
    const item = (ok, text, step) => out.push({ ok, text, step });
    const h = s.header;
    const missing = [["name", h.name], ["email", h.email], ["phone", h.phone]].filter(x => !x[1].trim()).map(x => x[0]);
    item(!missing.length, missing.length ? `Add your ${missing.join(", ")}.` : "Name, email, and phone are filled in.", 1);
    item(!!s.education[0].grad.trim(), s.education[0].grad.trim() ? "Graduation date is listed." : "Add your expected graduation date.", 2);
    const g = parseFloat(s.education[0].gpa);
    if (s.education[0].gpa.trim() && !isNaN(g) && g < 3.5) item(true, "Your GPA is under 3.5, so it's left off, as the guide says.", 2);
    const badCert = s.skills.certs.filter(c => c.name.trim() && c.status === "progress" && !c.date.trim());
    if (s.skills.certs.some(c => c.name.trim())) item(!badCert.length, badCert.length ? `Add an expected completion date for ${badCert.map(c => c.name).join(", ")}.` : "Certifications are listed with dates.", 3);
    else item(false, "No certifications listed yet. Add any you've earned or are working on.", 3);
    const other = s.otherSections.filter(o => /\bother\b/i.test(o.heading));
    if (s.otherSections.length) item(!other.length, other.length ? "Rename any section called “Other” after the type of work." : "Experience sections are named by type of work.", 5);
    const bl = [];
    const pushB = (arr, step) => (arr || []).forEach(b => { if (b && b.trim()) bl.push({ b, step }); });
    pushB(s.ttpr.bullets, 4); s.ttpr.subs.forEach(x => pushB(x, 4)); s.techJobs.forEach(j => pushB(j.bullets, 4));
    s.otherSections.forEach(o => o.jobs.forEach(j => pushB(j.bullets, 5)));
    pushB([s.capstone.purpose, s.capstone.approach, s.capstone.outcomes, s.capstone.contribution, ...s.capstone.extra], 6);
    s.projects.forEach(p => pushB(p.bullets, 6)); s.leadership.items.forEach(i => pushB(i.bullets, 7));
    const weak = bl.filter(x => !startsWithVerb(x.b));
    if (bl.length) item(!weak.length, weak.length ? `${weak.length} bullet${weak.length > 1 ? "s don't" : " doesn't"} start with an action verb.` : "Every bullet starts with an action verb.", weak.length ? weak[0].step : 6);
    const c = s.capstone;
    if (!c.name.trim()) item(false, "Add your TTPR capstone project.", 6);
    else {
      const filled = [c.purpose, c.approach, c.outcomes, c.contribution].filter(x => x.trim()).length;
      const hasNum = /\d/.test([c.approach, c.outcomes, c.contribution, ...c.extra].join(" "));
      item(filled === 4 && hasNum, filled < 4 ? `Your capstone answers ${filled} of the 4 questions.` : (hasNum ? "Capstone covers all 4 questions and includes measurable results." : "Add a number to your capstone results, like a team size, percent, or count."), 6);
    }
    item(pageCount <= 1, pageCount <= 1 ? "Fits on one page." : `Runs to about ${pageCount} pages. To trim, try the short skills list or drop relevant coursework.`, pageCount <= 1 ? 9 : 3);
    return out;
  }

  /* ---------- render ---------- */
  function isDone(i) { return (i === 0 || (state.visited || []).includes(i)) && STEPS[i].done(state); }
  function renderRail() {
    $("#rail").innerHTML = `<ol>${STEPS.map((st, i) => `<li><button type="button" data-action="goto" data-step="${i}" class="${isDone(i) ? "done" : ""}"${i === state.step ? ' aria-current="step"' : ""}>
      <span class="num">${isDone(i) && i !== state.step ? "&#x2713;" : i + 1}</span><span class="lbl">${esc(st.label)}</span></button></li>`).join("")}</ol>`;
  }
  function renderStep(opts = {}) {
    const y = window.scrollY;
    const i = state.step;
    state.visited = state.visited || [];
    if (!state.visited.includes(i)) state.visited.push(i);
    const next = STEPS[i + 1], prev = STEPS[i - 1];
    $("#form").innerHTML = STEPS[i].render()
      + `<nav class="stepnav" aria-label="Step navigation">
          ${prev ? `<button type="button" class="btn" data-action="goto" data-step="${i - 1}">Back</button>` : "<span></span>"}
          ${next ? `<button type="button" class="btn primary" data-action="goto" data-step="${i + 1}">Next: ${esc(next.label)}</button>` : ""}
        </nav>`;
    $$("#form textarea").forEach(grow);
    refreshChecks();
    renderRail();
    updateDlUI();
    if (opts.newStep) { window.scrollTo(0, 0); const h = $("#form h1"); h && h.focus({ preventScroll: true }); }
    else window.scrollTo(0, y);
    highlight();
  }
  function grow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + 3 + "px"; }

  const DATE_RE = /^(0[1-9]|1[0-2])\/(19|20)\d{2}$/;
  const CHECKS = {
    verb: v => (v || "").trim().length > 10 && !startsWithVerb(v) ? "Start with an action verb, like Analyzed, Built, or Led." : "",
    gpa: v => { v = (v || "").trim(); if (!v) return ""; const n = parseFloat(v); if (isNaN(n) || n > 4.5) return "Enter your GPA as a number, like 3.6."; return n < 3.5 ? ["info", "Under 3.5, so it stays off your resume. That's what the guide recommends."] : ""; },
    date: v => { v = (v || "").trim(); return !v || DATE_RE.test(v) || /^present$/i.test(v) ? "" : "Use MM/YYYY, like 06/2027."; },
    certdate: (v, path) => { const c = getP(parentPath(path)); return c.name.trim() && c.status === "progress" && !(v || "").trim() ? "Add the date you expect to finish." : CHECKS.date(v); },
    metric: v => (v || "").trim().length > 10 && !/\d/.test(v) ? ["info", "Add a number if you can: a count, a percent, or time saved."] : "",
    coursework: v => /\b[A-Za-z]{2,4}\s?\d{3,5}\b/.test(v || "") ? "Leave out course numbers. List course names only, like Data Mining." : "",
    heading: v => /\bother\b/i.test(v || "") ? "The guide says not to call this section “Other”. Name it after the type of work." : "",
    email: v => { v = (v || "").trim(); return !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? "" : "Check your email address."; },
    phone: v => { v = (v || "").trim(); return !v || /^\(\d{3}\) \d{3}-\d{4}$/.test(v) ? "" : ["info", "The guide's format is (XXX) XXX-XXXX."]; },
    track: v => ""
  };
  function refreshChecks() {
    $$("[data-check]").forEach(el => {
      const r = CHECKS[el.dataset.check](getP(el.dataset.path), el.dataset.path);
      const [kind, text] = Array.isArray(r) ? r : ["warn", r];
      el.textContent = text || ""; el.classList.toggle("info", kind === "info");
    });
  }

  function renderPreview() {
    const model = buildModel(state);
    const runs = rs => rs.map(r => r.b ? `<b>${esc(r.text)}</b>` : esc(r.text)).join("");
    const blk = b => {
      switch (b.t) {
        case "name": return `<div class="r-name${b.ph ? " ph" : ""}">${esc(b.text)}</div>`;
        case "contact": return `<div class="r-contact">${b.items.map(x => x.ph ? `<span class="ph">${esc(x.text)}</span>` : x.link ? `<span class="r-link">${esc(x.text)}</span>` : esc(x.text)).join(" | ")}</div>`;
        case "heading": return `<div class="r-heading">${esc(b.text)}</div>`;
        case "sep": return `<div class="r-sep"></div>`;
        case "eduhead": return `<div class="r-row"><span class="l"><span class="r-en gray">${esc(b.school)}</span>${b.location ? `- <b>${esc(b.location)}</b>` : ""}</span><span class="r" style="font-weight:700">${esc(b.right)}</span></div>`;
        case "entry": return `<div class="r-row"><span class="l"><span class="r-en${b.gray ? " gray" : ""}">${esc(b.upper ? b.name.toUpperCase() : b.name)}</span>${b.about ? `<span class="${b.aboutPlain ? "" : "gray"}">${b.aboutPlain ? "" : " "}${esc(b.about)}</span>` : ""}</span><span class="r"${b.rightBold ? ' style="font-weight:700"' : ""}>${esc(b.right)}</span></div>`;
        case "sub": return `<div class="r-row"><span class="l${b.gray ? " gray" : ""}">${esc(b.text)}</span><span class="r">${esc(b.right)}</span></div>`;
        case "detail": return `<div class="r-detail">${runs(b.runs)}</div>`;
        case "bullet": return `<div class="r-bullet${b.level ? " l1" : ""}">${runs(b.runs)}</div>`;
        case "table": return `<div class="r-table" style="grid-template-columns:repeat(${b.cols.length},1fr)">${b.cols.map(c => `<div>${c.map(blk).join("")}</div>`).join("")}</div>`;
        default: return `<div class="r-line${b.ph ? " ph" : ""}">${b.runs.map(r => `<span${r.gray ? ' class="gray"' : ""}>${r.b ? `<b>${esc(r.text)}</b>` : esc(r.text)}</span>`).join("")}</div>`;
      }
    };
    let html = "", cur = null;
    model.forEach(b => {
      if (b.sec !== cur) { if (cur !== null) html += "</div>"; html += `<div class="r-sec${b.sec === STEPS[state.step].sec ? " hl" : ""}" data-sec="${b.sec}">`; cur = b.sec; }
      html += blk(b);
    });
    html += "</div>";
    $("#sheet-inner").innerHTML = html;
    layoutSheet();
  }
  function layoutSheet() {
    const sheet = $("#sheet"), inner = $("#sheet-inner"), wrap = $("#sheet-wrap"), scroller = $("#preview-scroll");
    const avail = Math.max(260, scroller.clientWidth - 36);
    const scale = Math.min(1, avail / 816);
    const h = inner.offsetHeight;
    const contentPerPage = 1022.4, topPad = 19.2, padV = 33.6;
    pageCount = Math.max(1, Math.ceil((h - padV) / contentPerPage - 0.005));
    const sheetH = Math.max(1056, h);
    sheet.style.height = sheetH + "px";
    sheet.style.transform = `scale(${scale})`;
    wrap.style.width = 816 * scale + "px"; wrap.style.height = sheetH * scale + "px";
    $$(".pb", sheet).forEach(e => e.remove());
    for (let k = 1; k < pageCount; k++) {
      const d = document.createElement("div"); d.className = "pb"; d.style.top = (topPad + contentPerPage * k) + "px";
      d.innerHTML = `<span>p. ${k + 1}</span>`; sheet.appendChild(d);
    }
    const pc = $("#pages"); pc.textContent = pageCount === 1 ? "1 page" : `About ${pageCount} pages`; pc.classList.toggle("over", pageCount > 1);
    sheet.dataset.scale = scale;
  }
  function highlight(scroll = true) {
    const sec = STEPS[state.step].sec;
    $$(".r-sec").forEach(el => el.classList.toggle("hl", el.dataset.sec === sec));
    if (scroll && sec) {
      const el = $(`.r-sec[data-sec="${sec}"]`); const sc = $("#preview-scroll");
      if (el) { const scale = parseFloat($("#sheet").dataset.scale || 1); sc.scrollTo({ top: Math.max(0, el.offsetTop * scale - 40), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
    }
  }
  let pvT; function schedulePreview() { cancelAnimationFrame(pvT); pvT = requestAnimationFrame(renderPreview); }

  /* ---------- track presets ---------- */
  function untouched(track) {
    if (!track) return true;
    const p = trackPresetParts(track);
    return JSON.stringify(state.ttpr.bullets) === JSON.stringify(p.ttpr.bullets) && state.ttpr.title === p.ttpr.title
      && JSON.stringify(state.skills.short) === JSON.stringify(p.short) && JSON.stringify(state.skills.table) === JSON.stringify(p.table);
  }
  function applyTrack(t) {
    const p = trackPresetParts(t), old = state.track && state.track !== t ? PRESETS[state.track] : null;
    const conc = state.education[0].concentration;
    if (!conc || (old && conc === old.concentration) || conc === p.concentration) state.education[0].concentration = p.concentration;
    if (!state.ttpr.heading || state.ttpr.heading === "TECHNICAL EXPERIENCE" || (old && state.ttpr.heading === old.heading)) state.ttpr.heading = p.ttpr.heading;
    state.ttpr.title = p.ttpr.title; state.ttpr.bullets = p.ttpr.bullets; state.ttpr.subs = p.ttpr.bullets.map(() => []);
    ["org", "about", "location", "dates", "inline", "upper"].forEach(k => { state.ttpr[k] = p.ttpr[k]; });
    state.skills.short = p.short; state.skills.table = p.table;
    if (old && clean(state.skills.line) === old.line) state.skills.line = PRESETS[t].line;
    state.track = t; state.pendingTrack = false;
  }

  /* ---------- events ---------- */
  function onBind(el) {
    const path = el.dataset.bind;
    if (path === "track") {
      const prevT = state.track, t = el.value;
      if (t === prevT) return;
      if (untouched(prevT)) applyTrack(t); else { state.track = t; state.pendingTrack = true; }
      renderStep();
    } else {
      setP(path, el.type === "checkbox" ? el.checked : el.value);
      if (path === "skills.layout" && el.value === "line" && !clean(state.skills.line) && state.track) state.skills.line = PRESETS[state.track].line;
      if (el.tagName === "TEXTAREA") grow(el);
      if (el.hasAttribute("data-rerender")) renderStep();
      else { refreshChecks(); renderRail(); }
    }
    save(); schedulePreview();
  }
  document.addEventListener("input", e => { const el = e.target.closest("[data-bind]"); if (el && el.type !== "radio" && el.type !== "checkbox" && el.tagName !== "SELECT") onBind(el); });
  document.addEventListener("change", e => {
    const el = e.target.closest("[data-bind]"); if (!el) return;
    if (el.type === "radio" || el.type === "checkbox" || el.tagName === "SELECT") onBind(el);
    if (el.dataset.bind === "header.phone") {
      const d = el.value.replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
      if (d.length === 10) { el.value = `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`; onBind(el); }
    }
  });
  document.addEventListener("focusin", e => { if (e.target.matches("[data-bullet]")) lastBullet = e.target; });

  document.addEventListener("click", async e => {
    const btn = e.target.closest("[data-action]"); if (!btn) return;
    const a = btn.dataset.action, path = btn.dataset.path;
    if (a === "goto") {
      const n = +btn.dataset.step;
      if (state.step === 0 && n > 0 && !state.track) { const m = $('[data-check="track"]'); if (m) { m.textContent = "Choose Data Analytics or Cybersecurity to continue."; m.classList.remove("info"); } return; }
      state.step = n; save(); document.body.classList.remove("show-preview"); renderStep({ newStep: true });
    } else if (a === "push") {
      const arr = getP(path); arr.push(factories[btn.dataset.kind]()); save(); renderStep(); schedulePreview();
      const np = `${path}.${arr.length - 1}`;
      const f = $(`[data-bind="${np}"]`) || $(`[data-bind^="${np}."]`); f && f.focus();
    } else if (a === "remove") {
      const arr = getP(parentPath(path)); arr.splice(+path.split(".").pop(), 1); save(); renderStep(); schedulePreview();
    } else if (a === "set") {
      setP(path, JSON.parse(btn.dataset.value)); save(); renderStep(); schedulePreview();
    } else if (a === "add-ttpr") {
      state.ttpr.bullets.push(""); state.ttpr.subs.push([]); save(); renderStep(); schedulePreview();
      const f = $(`[data-bind="ttpr.bullets.${state.ttpr.bullets.length - 1}"]`); f && f.focus();
    } else if (a === "remove-ttpr") {
      const i = +btn.dataset.index; state.ttpr.bullets.splice(i, 1); state.ttpr.subs.splice(i, 1); save(); renderStep(); schedulePreview();
    } else if (a === "reset-line") {
      state.skills.line = PRESETS[state.track].line; save(); renderStep(); schedulePreview(); toast("Skills reset to the guide");
    } else if (a === "reset-ttpr") {
      state.ttpr.bullets = PRESETS[state.track].bullets.slice(); state.ttpr.subs = state.ttpr.bullets.map(() => []); save(); renderStep(); schedulePreview(); toast("TTPR bullets reset to the guide");
    } else if (a === "apply-track") {
      applyTrack(state.track); save(); renderStep(); schedulePreview();
    } else if (a === "keep-track") {
      state.pendingTrack = false; save(); renderStep();
    } else if (a === "reset-skills") {
      const p = trackPresetParts(state.track); state.skills[state.skills.layout === "short" ? "short" : "table"] = state.skills.layout === "short" ? p.short : p.table;
      save(); renderStep(); schedulePreview(); toast("Skills reset to the guide's list");
    } else if (a === "verbs") {
      $("#verbs").showModal();
    } else if (a === "download") {
      downloadDocx();
    } else if (a === "save-progress") {
      saveProgress();
    } else if (a === "load-progress") {
      $("#load-file").click();
    } else if (a === "reset-all") {
      if (btn.dataset.armed) { state = defaultState(); try { localStorage.removeItem(KEY); } catch (err) {} renderStep({ newStep: true }); renderPreview(); toast("Workbook cleared"); }
      else { btn.dataset.armed = "1"; btn.textContent = "Click again to erase everything"; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = "Start over with a blank workbook"; } }, 4000); }
    } else if (a === "show-preview") {
      document.body.classList.add("show-preview"); layoutSheet(); highlight();
    } else if (a === "hide-preview") {
      document.body.classList.remove("show-preview");
    }
  });

  // verb dialog
  function buildVerbs() {
    $("#verb-body").innerHTML = Object.entries(VERBS).map(([cat, list]) => `<h3>${esc(cat)}</h3><div class="chips">${[...new Set(list)].map(v => `<button type="button" class="chip" data-verb="${esc(v)}">${esc(v)}</button>`).join("")}</div>`).join("");
  }
  $("#verbs").addEventListener("click", e => {
    if (e.target === $("#verbs") || e.target.closest("[data-close]")) { $("#verbs").close(); return; }
    const chip = e.target.closest("[data-verb]"); if (!chip) return;
    if (!lastBullet || !lastBullet.isConnected) { toast("Click into a bullet first, then pick a verb."); return; }
    const verb = chip.dataset.verb, val = lastBullet.value.trimStart();
    const first = (val.split(/\s+/)[0] || "").replace(/[^A-Za-z-]/g, "");
    lastBullet.value = !val ? verb + " " : (first && startsWithVerb(first) && first.length > 2 && /^[A-Z]/.test(first)) ? verb + val.slice(val.indexOf(first) + first.length) : verb + " " + val;
    $("#verbs").close();
    lastBullet.focus(); lastBullet.setSelectionRange(lastBullet.value.length, lastBullet.value.length);
    onBind(lastBullet);
  });

  // downloads
  function fileName() {
    const parts = state.header.name.trim().split(/\s+/).filter(Boolean).map(p => p.replace(/[^A-Za-z0-9'-]/g, ""));
    const base = parts.length ? (parts.length > 1 ? `${parts[parts.length - 1]}_${parts[0]}` : parts[0]) : "My";
    return `${base}_Resume.docx`;
  }
  const LOCAL = !window.claude;
  function updateDlUI() {
    const off = !downloads && !LOCAL;
    $$("[data-dl]").forEach(b => b.disabled = off);
    const u = $("#dl-unavailable"); if (u) u.hidden = !off;
  }
  function localSave(filename, data) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith(".json") ? "application/json" : "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = filename; link.style.display = "none";
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  async function offer(filename, data, okMsg) {
    if (LOCAL) { localSave(filename, data); toast(okMsg); return; }
    if (!downloads) { toast("Downloads aren't available in this view."); return; }
    try { await downloads.save({ filename, data }); toast(okMsg); }
    catch (err) {
      if (err && err.code === "declined") return;
      if (err && err.code === "rate_limited") { toast("A download prompt is already open."); return; }
      toast("The file couldn't be saved here. Try again.");
    }
  }
  async function downloadDocx() {
    if (!window.JSZip) { toast("The Word export is still loading. Try again in a few seconds."); return; }
    try {
      const blob = await buildDocx(buildModel(state), window.JSZip, TEMPLATE_B64, TEMPLATE_ROOT, TEMPLATE_SECT);
      offer(fileName(), blob, "Resume downloaded");
    } catch (err) { toast("Couldn't build the Word file. Check your entries and try again."); }
  }
  function saveProgress() {
    offer("TTPR_resume_progress.json", JSON.stringify(state, null, 2), "Progress file saved");
  }
  $("#load-file").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const s = migrateState(JSON.parse(rd.result));
        if (!s) throw new Error();
        state = s; save(); renderStep({ newStep: true }); renderPreview(); toast("Progress loaded");
      } catch (err) { toast("That file isn't a TTPR workbook progress file."); }
      e.target.value = "";
    };
    rd.readAsText(f);
  });

  // init
  buildVerbs();
  renderStep({ newStep: false });
  renderPreview();
  if (state.step === 9) renderStep();
  new ResizeObserver(() => layoutSheet()).observe($("#preview-scroll"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutSheet(); if (state.step === 9) renderStep(); });
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(d => { downloads = d; updateDlUI(); }).catch(() => {});
  }
})();
</script>
</body>
</html>
